{% extends 'base.html' %}
{% block title %}Restock Product{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body">
                <h3 class="mb-3">Restock {{ product.name }}</h3>
                <p class="text-muted">Current stock: {{ product.stock }}</p>
                <form method="POST">
                    {{ form.hidden_tag() }}
                    <div class="mb-3">
                        {{ form.quantity.label(class_='form-label') }}
                        {{ form.quantity(class_='form-control') }}
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-warning" type="submit">Restock</button>
                        <a class="btn btn-outline-secondary" href="{{ url_for('home') }}">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
